<svg width="100%" height="120" viewBox="0 0 1000 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="footerCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>
    <linearGradient id="footerViolet" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
  </defs>

  <!-- Waves moving upwards to seal bottom -->
  <path fill="url(#footerViolet)" opacity="0.3">
    <animate attributeName="d" dur="12s" repeatCount="indefinite"
      values="M 0 60 Q 250 20 500 60 T 1000 60 L 1000 120 L 0 120 Z;
              M 0 45 Q 250 80 500 45 T 1000 45 L 1000 120 L 0 120 Z;
              M 0 60 Q 250 20 500 60 T 1000 60 L 1000 120 L 0 120 Z" />
  </path>
  <path fill="url(#footerCyan)" opacity="0.5">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M 0 75 Q 250 100 500 70 T 1000 75 L 1000 120 L 0 120 Z;
              M 0 65 Q 250 40 500 80 T 1000 65 L 1000 120 L 0 120 Z;
              M 0 75 Q 250 100 500 70 T 1000 75 L 1000 120 L 0 120 Z" />
  </path>
</svg>