<svg width="100%" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03060E" />
      <stop offset="50%" stop-color="#070C1B" />
      <stop offset="100%" stop-color="#020409" />
    </linearGradient>
    <linearGradient id="meshCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#7928CA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.2" />
    </linearGradient>
    <filter id="bgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="200" fill="url(#bgGrad3D)" rx="8" />

  <!-- 3D Perspective Grid Plane -->
  <g opacity="0.6">
    <line x1="0" y1="90" x2="1200" y2="90" stroke="#00F0FF" stroke-opacity="0.12" stroke-width="1" />
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#00F0FF" stroke-opacity="0.22" stroke-width="1.2" />
    <line x1="0" y1="155" x2="1200" y2="155" stroke="#00F0FF" stroke-opacity="0.35" stroke-width="1.5" />
    <line x1="0" y1="195" x2="1200" y2="195" stroke="#00F0FF" stroke-opacity="0.55" stroke-width="2" />

    <!-- Vanishing rays to (600, 50) -->
    <line x1="600" y1="50" x2="0" y2="200" stroke="#00F0FF" stroke-opacity="0.25" stroke-width="1.2" />
    <line x1="600" y1="50" x2="150" y2="200" stroke="#00F0FF" stroke-opacity="0.2" stroke-width="1" />
    <line x1="600" y1="50" x2="300" y2="200" stroke="#00F0FF" stroke-opacity="0.2" stroke-width="1" />
    <line x1="600" y1="50" x2="450" y2="200" stroke="#00F0FF" stroke-opacity="0.2" stroke-width="1" />
    <line x1="600" y1="50" x2="750" y2="200" stroke="#00F0FF" stroke-opacity="0.2" stroke-width="1" />
    <line x1="600" y1="50" x2="900" y2="200" stroke="#00F0FF" stroke-opacity="0.2" stroke-width="1" />
    <line x1="600" y1="50" x2="1050" y2="200" stroke="#00F0FF" stroke-opacity="0.2" stroke-width="1" />
    <line x1="600" y1="50" x2="1200" y2="200" stroke="#00F0FF" stroke-opacity="0.25" stroke-width="1.2" />
  </g>

  <!-- 3D Geometric Floating Wireframe Nodes -->
  <g transform="translate(600, 75)">
    <polygon points="0,-30 26,0 0,30 -26,0" fill="none" stroke="#00F0FF" stroke-width="1.8" filter="url(#bgGlow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite" />
    </polygon>
    <polygon points="0,-18 16,0 0,18 -16,0" fill="#7928CA" fill-opacity="0.3" stroke="#A855F7" stroke-width="1.2">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite" />
    </polygon>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" filter="url(#bgGlow)" />
  </g>

  <!-- Left & Right Floating Particles -->
  <circle cx="200" cy="80" r="3.5" fill="#00F0FF" filter="url(#bgGlow)">
    <animate attributeName="cy" values="75;85;75" dur="3s" repeatCount="indefinite" />
  </circle>
  <line x1="200" y1="80" x2="280" y2="120" stroke="#00F0FF" stroke-opacity="0.2" stroke-width="1" />
  <circle cx="280" cy="120" r="2.5" fill="#7928CA" />

  <circle cx="1000" cy="80" r="3.5" fill="#A855F7" filter="url(#bgGlow)">
    <animate attributeName="cy" values="85;75;85" dur="3s" repeatCount="indefinite" />
  </circle>
  <line x1="1000" y1="80" x2="920" y2="120" stroke="#A855F7" stroke-opacity="0.2" stroke-width="1" />
  <circle cx="920" cy="120" r="2.5" fill="#00F0FF" />

  <!-- Animated Horizon Scanning Laser -->
  <line x1="0" y1="120" x2="1200" y2="120" stroke="url(#meshCyan)" stroke-width="2.5" filter="url(#bgGlow)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
  </line>

  <!-- Overlay Header Text -->
  <text x="600" y="40" text-anchor="middle" font-family="'Fira Code', monospace" font-size="12" font-weight="700" letter-spacing="4" fill="#00F0FF">
    // 3D SPATIAL RECONSTRUCTION &amp; NEURAL EXPLORATION //
  </text>
  <text x="600" y="155" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="900" letter-spacing="3" fill="#FFFFFF" filter="url(#bgGlow)">
    IMMERSIVE 3D COMPUTING &amp; SPATIAL INTELLIGENCE
  </text>
</svg>
