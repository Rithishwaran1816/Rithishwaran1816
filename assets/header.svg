<svg width="100%" height="240" viewBox="0 0 1000 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Space Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#090E1B" />
      <stop offset="100%" stop-color="#04060A" />
    </linearGradient>

    <!-- 3D Neon Waves Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF">
        <animate attributeName="stop-color" values="#00F0FF;#7928CA;#0072FF;#00F0FF" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7928CA">
        <animate attributeName="stop-color" values="#7928CA;#0072FF;#00F0FF;#7928CA" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0072FF">
        <animate attributeName="stop-color" values="#0072FF;#00F0FF;#7928CA;#0072FF" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="neonViolet" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Radial Ambient Glows -->
    <radialGradient id="ambientCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ambientViolet" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#7928CA" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0" />
    </radialGradient>

    <!-- 3D Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="titleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="2" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 900;
      font-size: 50px;
      letter-spacing: 7px;
      fill: #FFFFFF;
    }
    .badge-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 4px;
      fill: #00F0FF;
    }
    .sub-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 18px;
      letter-spacing: 2.5px;
      fill: #E2E8F0;
    }
    .grid-line {
      stroke: #00F0FF;
      stroke-opacity: 0.12;
      stroke-width: 1;
    }
  </style>

  <!-- Background Base -->
  <rect width="1000" height="240" fill="url(#bgGrad)" rx="8" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="70" r="180" fill="url(#ambientCyan)" />
  <circle cx="800" cy="70" r="180" fill="url(#ambientViolet)" />

  <!-- 3D Perspective Floor Grid -->
  <g opacity="0.6">
    <!-- Perspective Horizon -->
    <line x1="0" y1="170" x2="1000" y2="170" stroke="#00F0FF" stroke-opacity="0.18" stroke-width="1" />
    <line x1="0" y1="190" x2="1000" y2="190" stroke="#00F0FF" stroke-opacity="0.22" stroke-width="1" />
    <line x1="0" y1="215" x2="1000" y2="215" stroke="#00F0FF" stroke-opacity="0.30" stroke-width="1.2" />
    <line x1="0" y1="239" x2="1000" y2="239" stroke="#00F0FF" stroke-opacity="0.45" stroke-width="1.5" />

    <!-- Perspective Vanishing Lines (Converging toward center horizon) -->
    <line x1="500" y1="150" x2="0" y2="240" class="grid-line" stroke-width="1.5" />
    <line x1="500" y1="150" x2="125" y2="240" class="grid-line" stroke-width="1.2" />
    <line x1="500" y1="150" x2="250" y2="240" class="grid-line" stroke-width="1.2" />
    <line x1="500" y1="150" x2="375" y2="240" class="grid-line" stroke-width="1.2" />
    <line x1="500" y1="150" x2="625" y2="240" class="grid-line" stroke-width="1.2" />
    <line x1="500" y1="150" x2="750" y2="240" class="grid-line" stroke-width="1.2" />
    <line x1="500" y1="150" x2="875" y2="240" class="grid-line" stroke-width="1.2" />
    <line x1="500" y1="150" x2="1000" y2="240" class="grid-line" stroke-width="1.5" />
  </g>

  <!-- Animated Dynamic 3D Waves -->
  <g>
    <!-- Back Wave -->
    <path fill="url(#neonViolet)" opacity="0.35">
      <animate attributeName="d" dur="14s" repeatCount="indefinite"
        values="M 0 170 Q 250 140 500 170 T 1000 170 L 1000 240 L 0 240 Z;
                M 0 160 Q 250 190 500 160 T 1000 160 L 1000 240 L 0 240 Z;
                M 0 175 Q 250 150 500 180 T 1000 175 L 1000 240 L 0 240 Z;
                M 0 170 Q 250 140 500 170 T 1000 170 L 1000 240 L 0 240 Z" />
    </path>

    <!-- Front Wave -->
    <path fill="url(#neonCyan)" opacity="0.45" filter="url(#neonGlow)">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M 0 185 Q 250 215 500 180 T 1000 185 L 1000 240 L 0 240 Z;
                M 0 175 Q 250 155 500 200 T 1000 175 L 1000 240 L 0 240 Z;
                M 0 195 Q 250 175 500 165 T 1000 195 L 1000 240 L 0 240 Z;
                M 0 185 Q 250 215 500 180 T 1000 185 L 1000 240 L 0 240 Z" />
    </path>
  </g>

  <!-- Glowing Corner Cyber Accents -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#00F0FF" stroke-width="2.5" opacity="0.8" />
  <circle cx="20" cy="20" r="3" fill="#00F0FF" />
  <path d="M 980 50 L 980 20 L 950 20" fill="none" stroke="#7928CA" stroke-width="2.5" opacity="0.8" />
  <circle cx="980" cy="20" r="3" fill="#7928CA" />

  <!-- Center Content -->
  <!-- Top Protocol Identifier -->
  <text x="500" y="48" text-anchor="middle" class="badge-text" filter="url(#neonGlow)">
    &lt; SYSTEM ARCHITECT // AI &amp; DIGITAL PRODUCTS /&gt;
  </text>

  <!-- Main Hero Title -->
  <text x="500" y="112" text-anchor="middle" class="title-text" filter="url(#titleGlow)">
    RITHISHWARAN K
  </text>

  <!-- Underline Light Beam -->
  <rect x="360" y="126" width="280" height="2" fill="url(#neonCyan)" rx="1">
    <animate attributeName="width" values="200;340;200" dur="4s" repeatCount="indefinite" />
    <animate attributeName="x" values="400;330;400" dur="4s" repeatCount="indefinite" />
  </rect>

  <!-- Subtitle -->
  <text x="500" y="156" text-anchor="middle" class="sub-text">
    Founder @ Zyphora Creations  |  Agentic AI &amp; Full-Stack Architect
  </text>
</svg>