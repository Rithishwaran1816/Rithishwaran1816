<svg width="100%" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Space Background -->
    <linearGradient id="deepSpace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030509" />
      <stop offset="40%" stop-color="#080E1D" />
      <stop offset="80%" stop-color="#050813" />
      <stop offset="100%" stop-color="#020306" />
    </linearGradient>

    <!-- Animated Neon Cyan & Violet Gradients -->
    <linearGradient id="neonGlow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF">
        <animate attributeName="stop-color" values="#00F0FF;#7928CA;#0072FF;#00F0FF" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7928CA">
        <animate attributeName="stop-color" values="#7928CA;#0072FF;#00F0FF;#7928CA" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0072FF">
        <animate attributeName="stop-color" values="#0072FF;#00F0FF;#7928CA;#0072FF" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="neonGlow2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Scanner Laser Beam Gradient -->
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0" />
    </linearGradient>

    <!-- Ambient Glow Filters -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="2" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="radialCyan" cx="20%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="radialViolet" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#7928CA" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Space Canvas -->
  <rect width="1200" height="320" fill="url(#deepSpace)" rx="10" />

  <!-- Ambient Light Orbs -->
  <circle cx="240" cy="110" r="220" fill="url(#radialCyan)" />
  <circle cx="960" cy="110" r="220" fill="url(#radialViolet)" />

  <!-- 3D PERSPECTIVE WIREFRAME GRID (FLOOR & HORIZON) -->
  <g opacity="0.85">
    <!-- Horizon Line -->
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#00F0FF" stroke-opacity="0.15" stroke-width="1" />
    <line x1="0" y1="205" x2="1200" y2="205" stroke="#00F0FF" stroke-opacity="0.22" stroke-width="1.2" />
    <line x1="0" y1="235" x2="1200" y2="235" stroke="#00F0FF" stroke-opacity="0.32" stroke-width="1.4" />
    <line x1="0" y1="272" x2="1200" y2="272" stroke="#00F0FF" stroke-opacity="0.45" stroke-width="1.6" />
    <line x1="0" y1="316" x2="1200" y2="316" stroke="#00F0FF" stroke-opacity="0.65" stroke-width="2" />

    <!-- Vanishing Perspective Lines Converging to center vanishing point (600, 150) -->
    <line x1="600" y1="150" x2="0" y2="320" stroke="#00F0FF" stroke-opacity="0.35" stroke-width="1.5" />
    <line x1="600" y1="150" x2="100" y2="320" stroke="#00F0FF" stroke-opacity="0.25" stroke-width="1.2" />
    <line x1="600" y1="150" x2="200" y2="320" stroke="#00F0FF" stroke-opacity="0.25" stroke-width="1.2" />
    <line x1="600" y1="150" x2="300" y2="320" stroke="#00F0FF" stroke-opacity="0.25" stroke-width="1.2" />
    <line x1="600" y1="150" x2="400" y2="320" stroke="#00F0FF" stroke-opacity="0.25" stroke-width="1.2" />
    <line x1="600" y1="150" x2="500" y2="320" stroke="#00F0FF" stroke-opacity="0.25" stroke-width="1.2" />
    <line x1="600" y1="150" x2="700" y2="320" stroke="#00F0FF" stroke-opacity="0.25" stroke-width="1.2" />
    <line x1="600" y1="150" x2="800" y2="320" stroke="#00F0FF" stroke-opacity="0.25" stroke-width="1.2" />
    <line x1="600" y1="150" x2="900" y2="320" stroke="#00F0FF" stroke-opacity="0.25" stroke-width="1.2" />
    <line x1="600" y1="150" x2="1000" y2="320" stroke="#00F0FF" stroke-opacity="0.25" stroke-width="1.2" />
    <line x1="600" y1="150" x2="1100" y2="320" stroke="#00F0FF" stroke-opacity="0.25" stroke-width="1.2" />
    <line x1="600" y1="150" x2="1200" y2="320" stroke="#00F0FF" stroke-opacity="0.35" stroke-width="1.5" />
  </g>

  <!-- 3D ROTATING WIREFRAME NEURAL CORE (CENTER BACKGROUND) -->
  <g transform="translate(600, 110)" opacity="0.35">
    <!-- Outer 3D Gyroscope Ring 1 -->
    <ellipse cx="0" cy="0" rx="90" ry="32" fill="none" stroke="#00F0FF" stroke-width="1.5" filter="url(#coreGlow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite" />
    </ellipse>
    <!-- Outer 3D Gyroscope Ring 2 -->
    <ellipse cx="0" cy="0" rx="90" ry="32" fill="none" stroke="#A855F7" stroke-width="1.5" filter="url(#coreGlow)">
      <animateTransform attributeName="transform" type="rotate" from="60" to="420" dur="18s" repeatCount="indefinite" />
    </ellipse>
    <!-- Outer 3D Gyroscope Ring 3 -->
    <ellipse cx="0" cy="0" rx="90" ry="32" fill="none" stroke="#38BDF8" stroke-width="1.2" filter="url(#coreGlow)">
      <animateTransform attributeName="transform" type="rotate" from="120" to="480" dur="14s" repeatCount="indefinite" />
    </ellipse>

    <!-- Floating 3D Isometric Diamond Core -->
    <polygon points="0,-40 35,0 0,40 -35,0" fill="none" stroke="#00F0FF" stroke-width="2" filter="url(#coreGlow)">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite" />
    </polygon>
    <polygon points="0,-22 20,0 0,22 -20,0" fill="#7928CA" fill-opacity="0.2" stroke="#FFFFFF" stroke-width="1.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite" />
    </polygon>
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" filter="url(#coreGlow)">
      <animate attributeName="r" values="4;6.5;4" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- 3D FLOATING CONSTELLATION / NEURAL NODES -->
  <g opacity="0.5">
    <circle cx="120" cy="60" r="3" fill="#00F0FF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" />
    </circle>
    <line x1="120" y1="60" x2="180" y2="90" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="180" cy="90" r="2.5" fill="#7928CA" />
    <line x1="180" y1="90" x2="140" y2="140" stroke="#7928CA" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="140" cy="140" r="2" fill="#00F0FF" />

    <circle cx="1080" cy="60" r="3" fill="#A855F7">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <line x1="1080" y1="60" x2="1020" y2="100" stroke="#A855F7" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="1020" cy="100" r="2.5" fill="#00F0FF" />
    <line x1="1020" y1="100" x2="1060" y2="140" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="1060" cy="140" r="2" fill="#A855F7" />
  </g>

  <!-- DYNAMIC 3D FLOWING SINE WAVES -->
  <g>
    <!-- Background Wave Layer -->
    <path fill="url(#neonGlow2)" opacity="0.35">
      <animate attributeName="d" dur="14s" repeatCount="indefinite"
        values="M 0 220 Q 300 180 600 220 T 1200 220 L 1200 320 L 0 320 Z;
                M 0 205 Q 300 245 600 205 T 1200 205 L 1200 320 L 0 320 Z;
                M 0 225 Q 300 195 600 230 T 1200 225 L 1200 320 L 0 320 Z;
                M 0 220 Q 300 180 600 220 T 1200 220 L 1200 320 L 0 320 Z" />
    </path>

    <!-- Foreground Neon Wave Layer -->
    <path fill="url(#neonGlow1)" opacity="0.5" filter="url(#coreGlow)">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M 0 235 Q 300 270 600 230 T 1200 235 L 1200 320 L 0 320 Z;
                M 0 220 Q 300 195 600 250 T 1200 220 L 1200 320 L 0 320 Z;
                M 0 245 Q 300 225 600 215 T 1200 245 L 1200 320 L 0 320 Z;
                M 0 235 Q 300 270 600 230 T 1200 235 L 1200 320 L 0 320 Z" />
    </path>
  </g>

  <!-- SCANNER LASER BEAM SWEEPING ACROSS HORIZON -->
  <line x1="0" y1="205" x2="1200" y2="205" stroke="url(#laserBeam)" stroke-width="3" filter="url(#coreGlow)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" />
  </line>

  <!-- CORNER CYBERNETIC BRACKETS -->
  <path d="M 25 55 L 25 25 L 55 25" fill="none" stroke="#00F0FF" stroke-width="2.5" opacity="0.85" />
  <circle cx="25" cy="25" r="3" fill="#00F0FF" />
  <path d="M 1175 55 L 1175 25 L 1145 25" fill="none" stroke="#7928CA" stroke-width="2.5" opacity="0.85" />
  <circle cx="1175" cy="25" r="3" fill="#7928CA" />

  <!-- CENTER TYPOGRAPHY & TELEMETRY -->
  <!-- Protocol Tag -->
  <text x="600" y="55" text-anchor="middle" font-family="'Fira Code', 'Courier New', monospace" font-size="13" font-weight="700" letter-spacing="5" fill="#00F0FF" filter="url(#coreGlow)">
    &lt; 3D NEURAL SPATIAL MATRIX // STATUS: ACTIVE /&gt;
  </text>

  <!-- Hero Main Title -->
  <text x="600" y="125" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="56" font-weight="900" letter-spacing="8" fill="#FFFFFF" filter="url(#neonBlur)">
    RITHISHWARAN K
  </text>

  <!-- Animated Neon Underline Beam -->
  <rect x="420" y="142" width="360" height="2.5" fill="url(#neonGlow1)" rx="1">
    <animate attributeName="width" values="240;420;240" dur="4s" repeatCount="indefinite" />
    <animate attributeName="x" values="480;390;480" dur="4s" repeatCount="indefinite" />
  </rect>

  <!-- Subtitle -->
  <text x="600" y="176" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" letter-spacing="3" fill="#E2E8F0">
    Founder @ Zyphora Creations  |  Agentic AI &amp; Full-Stack Architect
  </text>
</svg>