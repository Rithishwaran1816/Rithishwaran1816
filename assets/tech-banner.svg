<svg width="100%" height="160" viewBox="0 0 1000 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="techBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="50%" stop-color="#080E1C" />
      <stop offset="100%" stop-color="#030509" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="glowLeft" cx="15%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7928CA" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0" />
    </radialGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="160" fill="url(#techBg)" rx="8" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="80" r="120" fill="url(#glowLeft)" />
  <circle cx="850" cy="80" r="120" fill="url(#glowRight)" />

  <!-- 3D Perspective Grid Background -->
  <g opacity="0.75">
    <!-- Horizontal Perspective Lines -->
    <line x1="0" y1="70" x2="1000" y2="70" stroke="#00F0FF" stroke-opacity="0.12" stroke-width="1" />
    <line x1="0" y1="95" x2="1000" y2="95" stroke="#00F0FF" stroke-opacity="0.18" stroke-width="1" />
    <line x1="0" y1="125" x2="1000" y2="125" stroke="#00F0FF" stroke-opacity="0.28" stroke-width="1.2" />
    <line x1="0" y1="158" x2="1000" y2="158" stroke="#00F0FF" stroke-opacity="0.45" stroke-width="1.5" />

    <!-- Perspective Rays Converging to vanishing horizon point (500, 40) -->
    <line x1="500" y1="40" x2="0" y2="160" stroke="#00F0FF" stroke-opacity="0.2" stroke-width="1.2" />
    <line x1="500" y1="40" x2="100" y2="160" stroke="#00F0FF" stroke-opacity="0.2" stroke-width="1" />
    <line x1="500" y1="40" x2="200" y2="160" stroke="#00F0FF" stroke-opacity="0.2" stroke-width="1" />
    <line x1="500" y1="40" x2="300" y2="160" stroke="#00F0FF" stroke-opacity="0.2" stroke-width="1" />
    <line x1="500" y1="40" x2="400" y2="160" stroke="#00F0FF" stroke-opacity="0.2" stroke-width="1" />
    <line x1="500" y1="40" x2="600" y2="160" stroke="#00F0FF" stroke-opacity="0.2" stroke-width="1" />
    <line x1="500" y1="40" x2="700" y2="160" stroke="#00F0FF" stroke-opacity="0.2" stroke-width="1" />
    <line x1="500" y1="40" x2="800" y2="160" stroke="#00F0FF" stroke-opacity="0.2" stroke-width="1" />
    <line x1="500" y1="40" x2="900" y2="160" stroke="#00F0FF" stroke-opacity="0.2" stroke-width="1" />
    <line x1="500" y1="40" x2="1000" y2="160" stroke="#00F0FF" stroke-opacity="0.2" stroke-width="1.2" />
  </g>

  <!-- Animated Scanner Light Beam -->
  <line x1="0" y1="158" x2="1000" y2="158" stroke="url(#beamGrad)" stroke-width="3" filter="url(#glowFilter)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" />
  </line>

  <!-- Corner Tech Accents -->
  <path d="M 15 40 L 15 15 L 40 15" fill="none" stroke="#00F0FF" stroke-width="2" opacity="0.8" />
  <path d="M 985 40 L 985 15 L 960 15" fill="none" stroke="#7928CA" stroke-width="2" opacity="0.8" />

  <!-- Center Content -->
  <text x="500" y="45" text-anchor="middle" font-family="'Fira Code', monospace" font-size="12" font-weight="700" letter-spacing="4" fill="#00F0FF" filter="url(#glowFilter)">
    &lt; 3D NEURAL INFRASTRUCTURE // CORE CAPABILITIES /&gt;
  </text>
  <text x="500" y="88" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="900" letter-spacing="4" fill="#FFFFFF" filter="url(#glowFilter)">
    TECHNICAL ARSENAL &amp; AI STACK
  </text>
  <text x="500" y="118" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="2" fill="#94A3B8">
    Autonomous Systems • Real-Time Computer Vision • Cloud &amp; Mobile Architectures
  </text>
</svg>
